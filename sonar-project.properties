sonar.projectKey=sea-back
sonar.projectName=sea-back
sonar.projectVersion=1.0

# Codigo fuente Python del proyecto
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Analizar solo archivos Python
sonar.inclusions=**/*.py

# Excluir artefactos no relevantes
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/venv/**,**/env/**,**/*.pyc,**/static/**,templates/**,logs/**,manage.py
sonar.coverage.exclusions=**
# Tests
sonar.tests=apps
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py
