services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — persistent relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: sea_postgres
    restart: always
    environment:
      POSTGRES_DB: SEA_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Sandbox image — built once, used by Django at run-time via subprocess
  # ---------------------------------------------------------------------------
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: sea-sandbox:latest
    # This service exists only to build the image; it never runs as a
    # long-lived container.  ``profiles: [build]`` prevents ``docker compose up``
    # from starting it.
    profiles:
      - build

volumes:
  postgres_data:
    driver: local
