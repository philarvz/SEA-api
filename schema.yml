openapi: 3.0.3
info:
  title: SEA-API
  version: 1.0.0
  description: Sistema de Evaluación Académica - API para gestión de exámenes y evaluaciones
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: |-
        Get API information

        Response:
            - name: API name
            - version: API version
            - endpoints: Available endpoints
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/health/:
    get:
      operationId: auth_health_retrieve
      description: Verificar estado del servicio de autenticación
      tags:
      - Health
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  mode:
                    type: string
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Autenticar usuario con email y contraseña
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          description: Credenciales inválidas
        '500':
          description: Error interno del servidor
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refrescar token de acceso
      tags:
      - Authentication
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              refresh:
                type: string
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
          description: ''
        '400':
          description: Token de refresco requerido
        '401':
          description: Token inválido
components:
  schemas:
    LoginRequest:
      type: object
      description: |-
        Serializer for login requests
        Validates email and password
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenResponse:
      type: object
      description: |-
        Serializer for token response
        Returns access and refresh tokens
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - access
      - refresh
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
